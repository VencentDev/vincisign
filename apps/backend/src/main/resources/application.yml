spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  flyway:
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  port: ${SERVER_PORT:8080}

app:
  auth:
    session-ttl: ${APP_AUTH_SESSION_TTL:30d}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    auth:
      enabled: ${APP_RATE_LIMIT_AUTH_ENABLED:true}
      capacity: ${APP_RATE_LIMIT_AUTH_CAPACITY:60}
      refill-period: ${APP_RATE_LIMIT_AUTH_REFILL_PERIOD:1m}
  storage:
    supabase:
      url: ${SUPABASE_URL:}
      service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
      bucket: ${SUPABASE_STORAGE_BUCKET:vincisign-documents}
      signed-download-url-ttl: ${SUPABASE_STORAGE_SIGNED_URL_TTL_SECONDS:300s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
